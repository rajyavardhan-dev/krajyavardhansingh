<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1240" viewBox="0 0 1200 1240" fill="none">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="1240"><stop stop-color="#170027"/><stop offset=".5" stop-color="#340055"/><stop offset="1" stop-color="#160020"/></linearGradient>
 <linearGradient id="line" x1="0" y1="0" x2="1200" y2="0"><stop stop-color="#D8B4FE" stop-opacity=".15"/><stop offset=".5" stop-color="#E9D5FF" stop-opacity=".75"/><stop offset="1" stop-color="#D8B4FE" stop-opacity=".15"/></linearGradient>
 <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" stroke="#F3E8FF" stroke-opacity=".045"/></pattern>
 <filter id="glow"><feGaussianBlur stdDeviation="20"/></filter>
 <filter id="glass" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur in="SourceAlpha" stdDeviation="7" result="blur"/><feOffset dy="8"/><feComponentTransfer><feFuncA type="linear" slope=".22"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <style>
 .heading{font:700 30px Arial,sans-serif;fill:#F3E8FF;letter-spacing:1px}
 .eyebrow{font:12px monospace;fill:#D8B4FE;letter-spacing:3px}
 .body{font:18px Arial,sans-serif;fill:#E9D5FF}
 .muted{font:15px Arial,sans-serif;fill:#C4A7D8}
 .cardtitle{font:700 21px Arial,sans-serif;fill:#FFFFFF}
 .tag{font:13px monospace;fill:#E9D5FF}
 </style>
</defs>
<rect width="1200" height="1240" rx="28" fill="url(#bg)"/><rect width="1200" height="1240" rx="28" fill="url(#grid)"/>
<circle cx="1080" cy="160" r="180" fill="#A855F7" opacity=".18" filter="url(#glow)"/><circle cx="120" cy="960" r="180" fill="#7E22CE" opacity=".2" filter="url(#glow)"/>
<!-- About glass panel -->
<g filter="url(#glass)">
 <rect x="52" y="48" width="1096" height="245" rx="26" fill="#FFFFFF" fill-opacity=".075" stroke="#FFFFFF" stroke-opacity=".28"/>
 <path d="M53 104H1147" stroke="url(#line)"/>
 <text x="88" y="84" class="eyebrow">01 / WHO I AM</text>
 <text x="88" y="154" class="heading">A LITTLE ABOUT ME</text>
 <text x="88" y="198" class="body">I'm Rajyavardhan — a web developer working with WordPress and Shopify.</text>
 <text x="88" y="231" class="muted">I build responsive websites, customize themes and enjoy turning ideas into useful</text>
 <text x="88" y="256" class="muted">digital experiences. Right now, I'm sharpening JavaScript and learning full-stack.</text>
</g>
<!-- Toolkit glass panel -->
<g>
 <rect x="52" y="326" width="1096" height="205" rx="26" fill="#FFFFFF" fill-opacity=".075" stroke="#FFFFFF" stroke-opacity=".28"/>
 <path d="M53 382H1147" stroke="url(#line)"/>
 <text x="88" y="362" class="eyebrow">02 / THE TOOLKIT</text>
 <text x="88" y="429" class="heading">TOOLS I WORK WITH</text>
 <g transform="translate(88 456)">
  <rect width="125" height="42" rx="14" fill="#FFFFFF" fill-opacity=".09" stroke="#E9D5FF" stroke-opacity=".38"/><text x="62" y="27" text-anchor="middle" class="tag">HTML</text>
  <rect x="140" width="125" height="42" rx="14" fill="#FFFFFF" fill-opacity=".09" stroke="#E9D5FF" stroke-opacity=".38"/><text x="202" y="27" text-anchor="middle" class="tag">CSS</text>
  <rect x="280" width="155" height="42" rx="14" fill="#FFFFFF" fill-opacity=".09" stroke="#E9D5FF" stroke-opacity=".38"/><text x="357" y="27" text-anchor="middle" class="tag">JavaScript</text>
  <rect x="450" width="155" height="42" rx="14" fill="#FFFFFF" fill-opacity=".09" stroke="#E9D5FF" stroke-opacity=".38"/><text x="527" y="27" text-anchor="middle" class="tag">WordPress</text>
  <rect x="620" width="135" height="42" rx="14" fill="#FFFFFF" fill-opacity=".09" stroke="#E9D5FF" stroke-opacity=".38"/><text x="687" y="27" text-anchor="middle" class="tag">Shopify</text>
  <rect x="770" width="140" height="42" rx="14" fill="#FFFFFF" fill-opacity=".09" stroke="#E9D5FF" stroke-opacity=".38"/><text x="840" y="27" text-anchor="middle" class="tag">Liquid</text>
 </g>
</g>
<!-- Projects panel -->
<g>
 <rect x="52" y="564" width="1096" height="590" rx="26" fill="#FFFFFF" fill-opacity=".075" stroke="#FFFFFF" stroke-opacity=".28"/>
 <path d="M53 620H1147" stroke="url(#line)"/>
 <text x="88" y="600" class="eyebrow">03 / SELECTED WORK</text>
 <text x="88" y="668" class="heading">A FEW THINGS I'VE BUILT</text>
 <g>
  <rect x="88" y="704" width="1024" height="122" rx="20" fill="#FFFFFF" fill-opacity=".065" stroke="#FFFFFF" stroke-opacity=".2"/>
  <text x="116" y="744" class="eyebrow">PROJECT 01</text><text x="116" y="779" class="cardtitle">Food Location</text>
  <text x="116" y="805" class="muted">Restaurant discovery UI · Filters, ratings, reviews and distance sorting</text>
  <rect x="916" y="742" width="160" height="38" rx="14" fill="#7E22CE" fill-opacity=".25" stroke="#D8B4FE" stroke-opacity=".4"/><text x="996" y="766" text-anchor="middle" class="tag">HTML / CSS / JS</text>
 </g>
 <g>
  <rect x="88" y="850" width="1024" height="122" rx="20" fill="#FFFFFF" fill-opacity=".065" stroke="#FFFFFF" stroke-opacity=".2"/>
  <text x="116" y="890" class="eyebrow">PROJECT 02</text><text x="116" y="925" class="cardtitle">Student Records Archive</text>
  <text x="116" y="951" class="muted">Student record manager · IndexedDB, CSV/JSON import and export</text>
  <rect x="916" y="888" width="160" height="38" rx="14" fill="#7E22CE" fill-opacity=".25" stroke="#D8B4FE" stroke-opacity=".4"/><text x="996" y="912" text-anchor="middle" class="tag">HTML / CSS / JS</text>
 </g>
 <g>
  <rect x="88" y="996" width="1024" height="122" rx="20" fill="#FFFFFF" fill-opacity=".065" stroke="#FFFFFF" stroke-opacity=".2"/>
  <text x="116" y="1036" class="eyebrow">PROJECT 03</text><text x="116" y="1071" class="cardtitle">JavaScript Practice</text>
  <text x="116" y="1097" class="muted">Hands-on exercises with variables, conditions, loops, arrays and objects</text>
  <rect x="916" y="1034" width="160" height="38" rx="14" fill="#7E22CE" fill-opacity=".25" stroke="#D8B4FE" stroke-opacity=".4"/><text x="996" y="1058" text-anchor="middle" class="tag">JAVASCRIPT</text>
 </g>
</g>
<!-- subtle breathing animation -->
<g opacity=".0"><animate attributeName="opacity" values="0;.12;0" dur="6s" repeatCount="indefinite"/><rect x="52" y="48" width="1096" height="1106" rx="26" stroke="#FFFFFF" stroke-width="2"/></g>
</svg>